<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>9999</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap');

:root{
  --bg:#F7F1DF;
  --paper:#F1E8CC;
  --ink:#1B2A4A;
  --sub:#9C8B63;
  --blue:#1E6FFF;
  --purple:#9B5DE5;
  --red:#FF3B30;
  --yellow:#FFD400;
  --green:#2ECC71;
  --orange:#FF7A00;
  --purple:#9B5DE5;
  --teal:#00BFA6;
  --cream:#FFF8E7;
  /* rarity + buff/debuff — vivid primaries: red/blue/yellow/green/orange */
  --c-common:#2ECC71;
  --c-rare:#1E6FFF;
  --c-epic:#FF7A00;
  --c-legend:#FFD400;
  --c-junk:#8A7A63;
  --c-buff:#2ECC71;
  --c-debuff:#FF3B30;
  /* role colors per window */
  --role-opp:#2ECC71;
  --role-chain:#FF7A00;
  --role-shop:#FF3B30;
  --role-self:#1E6FFF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation;}
button{touch-action:manipulation; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
html,body{
  margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:'Zen Kaku Gothic New',sans-serif;
  height:100%; height:100dvh; height:100svh; overflow:hidden; overscroll-behavior:none;
}
.mono{font-family:'Share Tech Mono',monospace;}
#app{
  height:100vh; height:100dvh; height:100svh;
  max-width:480px;margin:0 auto;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  padding:3px 3px calc(30px + env(safe-area-inset-bottom, 0px));
  row-gap:2px;
  overflow:hidden;
}

/* header */
.title{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;flex:0 0 auto;padding:2px 2px 0;column-gap:6px;}
.title h1{justify-self:start;}
.title .settings-btn{justify-self:end;}
.bgm-track-name{justify-self:center;text-align:center;font-size:8px;color:var(--sub);white-space:nowrap;overflow:hidden;max-width:140px;letter-spacing:0.5px;position:relative;}
.bgm-track-name .bgm-track-inner{display:inline-block;}
.bgm-track-name.scrolling{text-align:left;}
.bgm-track-name.scrolling .bgm-track-inner{display:inline-flex;animation:bgmMarquee 7s linear infinite;}
@keyframes bgmMarquee{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.title h1{font-family:'Share Tech Mono',monospace;font-size:14px;letter-spacing:2px;margin:0;color:var(--blue);font-weight:900;}
.title .reset{font-size:9px;color:var(--red);background:none;border:1.5px solid var(--red);border-radius:6px;padding:3px 8px;cursor:pointer;font-weight:700;}
.title .settings-btn{color:var(--purple);border-color:var(--purple);}

/* settings modal */
.settings-modal{background:var(--bg);border:1.5px solid var(--purple);border-radius:14px;padding:16px;max-width:300px;width:100%;}
.settings-modal.howto-modal{max-width:340px;max-height:78vh;display:flex;flex-direction:column;}
.howto-body{overflow-y:auto;text-align:left;padding-right:2px;}
.howto-sec{margin-bottom:12px;}
.howto-sec b{font-size:10px;color:var(--blue);letter-spacing:0.5px;}
.howto-sec p{font-size:10.5px;color:var(--ink);line-height:1.6;margin:3px 0 0;}
.settings-modal h3{margin:0 0 14px;font-size:14px;color:var(--purple);}
.settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:12px;color:var(--ink);}
.sound-toggle{padding:6px 14px;border-radius:8px;border:2px solid var(--purple);color:var(--purple);background:transparent;font-weight:900;font-size:11px;cursor:pointer;}
.speed-btn{flex:1;padding:8px 4px;border-radius:8px;border:2px solid var(--sub);color:var(--sub);background:transparent;font-weight:900;font-size:12px;cursor:pointer;}
.speed-btn.active{border-color:var(--purple);color:var(--purple);}
.diff-btn-row{display:flex;gap:6px;margin-bottom:12px;}
.diff-btn{flex:1;padding:10px 4px;border-radius:9px;border:2px solid var(--sub);color:var(--sub);background:transparent;font-weight:900;font-size:11px;cursor:pointer;}
.diff-btn.active{border-color:var(--orange);color:var(--orange);}
.diff-btn.locked{opacity:0.45;cursor:not-allowed;}
.diff-desc-box{border:1.5px solid var(--sub);border-radius:9px;padding:8px 10px;text-align:left;}
.unlock-msg{color:var(--orange);font-weight:900;font-size:11px;letter-spacing:0.5px;margin-bottom:10px;}
.sound-toggle.off{border-color:var(--sub);color:var(--sub);}
.settings-modal input[type=range]{width:100%;accent-color:var(--purple);}
.settings-close{width:100%;padding:10px;border-radius:9px;border:1.5px solid var(--sub);background:transparent;color:var(--sub);font-weight:700;cursor:pointer;font-size:12px;margin-top:4px;}
.diff-btn-row .settings-close,.diff-btn-row .start-btn{width:auto;}

/* middleWrap: 中央の可変エリア（SHOP等＋ITEMS）。この行の高さは常に「画面残り分」に固定される */
#middleWrap{min-height:0;display:flex;flex-direction:column;gap:2px;overflow:hidden;}

/* scroll area: 相手/チェイン/ショップ。中身が多いときはここだけ内側スクロール */
#scrollArea{flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:2px;padding-bottom:0;}
#invPanel{flex:1 1 auto;min-height:20px;overflow-y:auto;position:relative;border:1.5px solid var(--role-self);margin-bottom:4px;}
#invPanel h2{color:var(--role-self);}
#scrollArea::-webkit-scrollbar{width:4px;}
#scrollArea::-webkit-scrollbar-thumb{background:var(--sub);border-radius:2px;}

.panel{background:transparent;border:1.5px solid var(--sub);border-radius:11px;padding:4px 5px;flex:0 0 auto;}
.panel h2{font-size:8px;letter-spacing:1px;margin:0 0 3px;font-weight:700;text-transform:uppercase;color:var(--sub);}
.panel.role-opp{border-color:var(--role-opp);}
.panel.role-opp h2{color:var(--role-opp);}
.panel.role-chain{border-color:var(--role-chain);padding:0;}
.panel.role-shop{border-color:var(--role-shop);}
.panel.role-shop h2{color:var(--role-shop);}
.panel.role-log{border-color:var(--role-log);}
.panel.role-log h2{color:var(--role-log);}

/* opponents */
.opp-grid{display:flex;gap:6px;}
.opp-card{flex:1;background:transparent;border:1.5px solid var(--role-opp);border-radius:7px;padding:2px;position:relative;min-width:0;}
.opp-card.leader{border-width:2.5px;}
.opp-name{font-size:9px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;}
.opp-personality{font-size:7px;color:var(--sub);margin-bottom:3px;}
.opp-die-row{display:flex;align-items:center;gap:3px;margin-bottom:2px;flex-wrap:wrap;}
.opp-die{width:20px;height:20px;border-radius:5px;background:transparent;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:11px;flex-shrink:0;}
.item-dots{display:flex;flex-wrap:wrap;gap:2px;max-width:44px;}
.item-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.opp-bar{height:5px;border-radius:3px;background:rgba(0,0,0,0.06);overflow:hidden;margin-bottom:3px;}
.opp-bar-fill{height:100%;}
.opp-score{font-size:8px;color:var(--sub);font-family:'Share Tech Mono',monospace;}
.bubble{
  position:absolute;top:-8px;left:5px;background:var(--bg);color:var(--yellow);border:1.5px solid var(--yellow);font-size:8px;padding:1px 5px;border-radius:7px;
  font-weight:700;white-space:nowrap;
}
.rank-badge{position:absolute;top:-9px;right:3px;font-size:9px;font-weight:900;background:var(--bg);border:1.5px solid;border-radius:8px;padding:1px 5px;}

/* chain */
.chain-box{display:flex;align-items:center;gap:6px;font-size:9px;padding:3px 5px;}
.chain-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--role-chain);flex-shrink:0;}
.chain-dot.active{background:var(--role-chain);box-shadow:0 0 5px rgba(255,122,0,0.6);animation:chainDotPulse .5s ease-in-out infinite alternate;}
@keyframes chainDotPulse{0%{box-shadow:0 0 4px rgba(255,122,0,0.5);}100%{box-shadow:0 0 12px rgba(255,122,0,0.9);}}
.panel.role-chain.chain-live{animation:chainPanelGlow .8s ease-in-out infinite alternate;}
@keyframes chainPanelGlow{0%{box-shadow:0 0 0 rgba(255,122,0,0);}100%{box-shadow:0 0 10px rgba(255,122,0,0.5);}}
.chain-text{color:var(--role-chain);flex:1;}
.chain-text b{color:var(--role-chain);}
.ticker{font-size:8px;color:var(--sub);padding:0 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Share Tech Mono',monospace;}
.ticker.win{color:var(--c-buff);font-weight:700;}
.ticker.atk{color:var(--c-debuff);font-weight:700;}

/* shop */
.shop-slots{display:flex;align-items:stretch;gap:6px;margin-bottom:6px;}
.slot{flex:1;background:transparent;border:1.5px solid var(--sub);border-radius:8px;padding:3px;height:160px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden;}
.slot.fever-slot{height:196px;}
.fever-buy-btn{width:100%;margin-top:3px;padding:6px 3px;border-radius:8px;font-weight:900;font-size:9.5px;line-height:1.2;cursor:pointer;background:transparent;border:2px solid var(--orange);color:var(--orange);animation:feverBtnPulse 1s ease-in-out infinite alternate;}
.fever-buy-btn:disabled{background:transparent;border-color:var(--sub);color:var(--sub);animation:none;}
@keyframes feverBtnPulse{0%{box-shadow:0 0 0 rgba(255,122,0,0);}100%{box-shadow:0 0 6px rgba(255,122,0,0.6);}}
.role-shop.fever-live{animation:feverGlow 1.1s ease-in-out infinite alternate;}
@keyframes feverGlow{0%{box-shadow:0 0 2px rgba(255,122,0,0.15);}100%{box-shadow:0 0 9px rgba(255,122,0,0.45);}}
.fever-tag{color:var(--orange);font-weight:900;font-size:9px;margin-left:8px;letter-spacing:0.5px;}

/* フィーバータイム演出：ゲーム全体のアウトライン基調デザインに合わせたバナー */
.fever-banner{position:fixed;top:16%;left:50%;transform:translate(-50%,-50%);z-index:80;pointer-events:none;animation:feverBannerPop 2.6s cubic-bezier(.22,.9,.3,1) forwards;}
.fever-banner-card{background:var(--bg);border:2.5px solid var(--orange);border-radius:16px;padding:12px 26px;text-align:center;box-shadow:0 0 0 5px rgba(255,122,0,0.12), 0 10px 26px rgba(27,42,74,0.18);}
.fever-banner-title{font-family:'Share Tech Mono',monospace;font-size:19px;font-weight:900;letter-spacing:3px;color:var(--orange);white-space:nowrap;}
.fever-banner-title .fever-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin:0 6px;vertical-align:middle;}
.fever-banner-sub{font-size:11px;font-weight:900;margin-top:6px;letter-spacing:0.3px;color:var(--ink);font-style:italic;}
.fever-banner-sub2{font-size:9px;font-weight:700;margin-top:3px;letter-spacing:0.2px;color:var(--sub);}
@keyframes feverBannerPop{
  0%{opacity:0;transform:translate(-50%,-70%) scale(0.9);}
  12%{opacity:1;transform:translate(-50%,-50%) scale(1.02);}
  18%{transform:translate(-50%,-50%) scale(1);}
  85%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) scale(0.98);}
}
.slot.locked{opacity:0.4;}
.slot.auction{animation:auctionPulse 1s ease-in-out infinite;}
.slot.auction.mine{animation:auctionPulseMine 0.7s ease-in-out infinite;border-width:3px!important;background:rgba(30,111,255,0.08);}
@keyframes auctionPulseMine{0%{box-shadow:0 0 4px var(--blue);}50%{box-shadow:0 0 16px var(--blue);}100%{box-shadow:0 0 4px var(--blue);}}
@keyframes auctionPulse{0%{box-shadow:0 0 0 rgba(0,0,0,0);}50%{box-shadow:0 0 8px currentColor;}100%{box-shadow:0 0 0 rgba(0,0,0,0);}}
.slot .rarity-tag{font-size:7px;letter-spacing:1px;padding:2px 5px;border-radius:3px;display:inline-block;margin-bottom:3px;font-weight:700;border:1.5px solid;background:transparent;}
.slot .iname{font-size:9.5px;font-weight:700;line-height:1.2;margin-bottom:1px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot .idesc{font-size:7.5px;color:var(--sub);line-height:1.2;margin-bottom:0;}
.slot .idesc.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:18px;}
.slot .status-line{min-height:9.5px;margin-top:2px;font-size:7.5px;line-height:1.2;}
.slot .price-label{font-size:6.5px;color:var(--sub);letter-spacing:0.5px;margin-bottom:1px;}
.slot .price-big{font-size:15px;font-family:'Share Tech Mono',monospace;font-weight:900;line-height:1;}
.slot .price-big.raise{font-size:19px;}
.slot button{width:100%;margin-top:3px;padding:6px 3px;border-radius:8px;font-weight:900;font-size:10px;line-height:1.2;cursor:pointer;background:transparent;border:2px solid var(--purple);color:var(--purple);min-height:32px;}
.slot button:disabled{border-color:var(--sub)!important;color:var(--sub)!important;cursor:not-allowed;}
.slot .empty{color:var(--sub);font-size:9px;text-align:center;margin:auto;}

.shop-status{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:var(--sub);margin-bottom:3px;}
.enter-btn{width:100%;padding:12px;border:none;border-radius:9px;background:transparent;border:2px solid var(--role-shop);color:var(--role-shop);font-weight:900;cursor:pointer;font-size:13px;}
.enter-btn:active{transform:scale(0.97);}
.enter-btn:disabled{border-color:var(--sub);color:var(--sub);cursor:not-allowed;}
.leave-btn{width:100%;padding:10px;border-radius:9px;background:transparent;border:2px solid var(--role-shop);color:var(--role-shop);font-weight:900;cursor:pointer;font-size:12px;margin-top:5px;}
.leave-btn:active{transform:scale(0.97);}

/* log */
.log-box{max-height:64px;overflow-y:auto;display:flex;flex-direction:column-reverse;font-size:8px;font-family:'Share Tech Mono',monospace;}
.log-line{padding:1px 0;border-bottom:1px solid var(--paper);color:var(--sub);}
.log-line b{color:var(--ink);}
.log-line.win{color:var(--c-buff);font-weight:700;}
.log-line.atk{color:var(--c-debuff);font-weight:700;}

/* self panel — pinned, never rebuilt via innerHTML during play. Outline style like everything else. */
#selfPanel{flex:0 0 auto;background:transparent;border:1.5px solid var(--role-self);border-radius:12px;padding:6px;margin-bottom:2px;position:relative;}

.inventory-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:3px;}
.inv-chip{font-size:8px;padding:2px 6px;border-radius:6px;font-weight:700;white-space:nowrap;border:1.5px solid var(--sub);background:transparent;cursor:pointer;}
.inv-empty{font-size:8px;color:var(--sub);font-style:italic;}
.inv-tip{
  position:absolute;background:var(--ink);color:var(--cream);font-size:9px;line-height:1.4;
  padding:6px 8px;border-radius:8px;max-width:190px;z-index:6;display:none;pointer-events:none;
  box-shadow:0 3px 8px rgba(0,0,0,0.25);
}
.inv-tip.show{display:block;}
.inv-tip::after{content:'';position:absolute;bottom:-5px;left:16px;border-width:5px 5px 0;border-style:solid;border-color:var(--ink) transparent transparent transparent;}

.self-row{display:flex;gap:10px;align-items:center;}
.die-wrap{position:relative;flex-shrink:0;}
.roll-pop{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-family:'Share Tech Mono',monospace;font-weight:900;font-size:16px;color:var(--role-self);pointer-events:none;animation:popFloat .75s ease-out forwards;z-index:5;white-space:nowrap;}
.roll-pop.combo{color:var(--orange);font-size:14px;}
@keyframes popFloat{
  0%{opacity:1;transform:translate(-50%,0) scale(0.7);}
  25%{transform:translate(-50%,-16px) scale(1.2);}
  100%{opacity:0;transform:translate(-50%,-42px) scale(1);}
}
.dice-dots{position:absolute;top:-6px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:56px;z-index:2;}
.dice-dots .dot{width:6px;height:6px;border-radius:50%;background:var(--role-self);border:1.5px solid var(--bg);}
.big-die{
  width:46px;height:46px;border-radius:12px;background:transparent;
  border:1.5px solid var(--role-self);display:flex;align-items:center;justify-content:center;
  font-family:'Share Tech Mono',monospace;font-size:20px;color:var(--role-self);
  flex-shrink:0;
}
.big-die.spin{animation:diceSpin .3s linear infinite;}
@keyframes diceSpin{
  0%{transform:rotate(0deg) scale(1);}
  50%{transform:rotate(7deg) scale(1.05);}
  100%{transform:rotate(-6deg) scale(1);}
}
.self-info{flex:1;min-width:0;}
.self-name{font-size:11px;color:var(--role-self);font-weight:700;margin-bottom:3px;}
.progress-wrap{border:1.5px solid var(--role-self);border-radius:6px;height:14px;position:relative;overflow:hidden;margin-bottom:3px;background:rgba(30,111,255,0.1);}
.progress-fill{height:100%;background:var(--role-self);transition:width .25s;}
.progress-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'Share Tech Mono',monospace;color:var(--ink);font-weight:700;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 3px var(--bg);}
.stat-row{display:flex;gap:8px;font-size:9px;color:var(--sub);}
.stat-row b{color:var(--ink);}

.roll-btn{
  margin-top:5px;width:100%;padding:11px;border:none;border-radius:12px;
  background:var(--orange);color:var(--cream);font-weight:900;font-size:15px;letter-spacing:1.5px;
  cursor:pointer;transition:transform .06s;user-select:none;
}
.roll-btn:active{transform:scale(0.96);}
.roll-btn.cooldown{background:transparent;color:var(--sub);border:1.5px solid var(--sub);}

.cooldown-bar-wrap{height:6px;border-radius:3px;background:rgba(30,111,255,0.1);border:1px solid var(--role-self);overflow:hidden;margin-top:4px;}
.cooldown-bar-fill{height:100%;background:var(--green);transition:width .05s linear;}
.cooldown-bar-fill.spinning{background:var(--orange);}
.cooldown-bar-fill.frozen{background:var(--red);}
.cooldown-label{font-size:9px;color:var(--sub);text-align:center;margin-top:3px;letter-spacing:0.5px;}

.info-badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;max-height:34px;overflow-y:auto;}
.badge{font-size:8px;background:transparent;border:1.5px solid var(--sub);border-radius:5px;padding:2px 5px;color:var(--sub);font-weight:700;}
.badge.buff{border-color:var(--c-buff);color:var(--c-buff);}
.badge.debuff{border-color:var(--c-debuff);color:var(--c-debuff);}
.badge.combo-badge{border-color:var(--sub);color:var(--sub);font-weight:900;}
.badge.combo-badge.active{border-color:var(--orange);color:var(--orange);animation:comboBadgePulse .5s ease-in-out infinite alternate;}
@keyframes comboBadgePulse{0%{transform:scale(1);}100%{transform:scale(1.08);}}

/* target modal */
.overlay{position:fixed;inset:0;background:rgba(27,42,74,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--bg);border:1.5px solid var(--role-self);border-radius:14px;padding:16px;max-width:300px;width:100%;}
.modal h3{margin:0 0 10px;font-size:13px;color:var(--ink);}
.modal button{display:block;width:100%;padding:10px;margin-bottom:6px;border:1.5px solid var(--sub);border-radius:9px;background:transparent;color:var(--ink);cursor:pointer;font-size:12px;font-weight:700;}
.modal button:active{border-color:var(--role-self);color:var(--role-self);}
.modal .cancel{color:var(--red);border-color:var(--red);}

.win-overlay{position:fixed;inset:0;background:rgba(27,42,74,0.92);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;z-index:60;text-align:center;padding:16px;padding-top:40px;overflow-y:auto;}
.win-overlay h1{font-family:'Share Tech Mono',monospace;font-size:32px;color:var(--yellow);letter-spacing:2px;}
.win-overlay button{margin-top:16px;margin-bottom:40px;padding:10px 22px;border-radius:10px;background:transparent;border:2px solid var(--yellow);color:var(--yellow);font-weight:900;cursor:pointer;flex-shrink:0;}
.result-list{width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px;}
.result-card{border:1.5px solid var(--sub);border-radius:10px;padding:8px;text-align:left;background:rgba(255,255,255,0.03);}
.result-head{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:4px;}
.result-stats{font-size:9px;color:var(--cream);opacity:0.85;margin-bottom:5px;}
.result-items{display:flex;flex-wrap:wrap;gap:3px;}
.result-chip{font-size:8px;padding:2px 5px;border-radius:5px;border:1.5px solid;font-weight:700;white-space:nowrap;}

/* start screen */
.start-screen{height:100%;grid-row:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0;gap:6px;overflow:hidden;}
.start-logo-wrap{width:100%;flex:0 0 auto;padding:0 32px;}
.start-logo{width:100%;height:auto;display:block;}
.start-logo path{fill:var(--blue);}
.start-bottom{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:0 22px;}
.start-title{font-family:'Share Tech Mono',monospace;font-size:52px;letter-spacing:6px;margin:0;color:var(--blue);font-weight:900;}
.start-sub{font-size:13px;letter-spacing:4px;color:var(--blue);font-weight:700;margin-bottom:12px;}
.start-desc{font-size:13px;color:var(--ink);line-height:1.65;max-width:320px;margin:0 0 6px;}
.start-desc.ja{font-size:11.5px;color:var(--sub);margin:0 0 18px;max-width:320px;}
.start-btn{padding:10px 24px;border:1.5px solid var(--orange);border-radius:11px;background:transparent;color:var(--orange);font-weight:900;font-size:13px;letter-spacing:1px;cursor:pointer;margin-bottom:7px;}
.start-btn-row{display:flex;gap:10px;justify-content:center;}
.version-tag{font-size:8px;color:var(--sub);margin-top:10px;letter-spacing:1px;}
.start-btn.small{padding:9px 20px;font-size:12px;letter-spacing:0.5px;margin-bottom:0;}
.start-btn:active{transform:scale(0.97);}

<script>
// ---------- sound engine (Web Audio, no external files) ----------
// ダブルタップでの拡大を防止（iOS Safariのフォールバック）
// ※ touchendでの判定のみに絞る（touchstartで止めると連打プレイ自体を壊してしまうため）
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  const now = Date.now();
  if(now - lastTouchEnd <= 350){ e.preventDefault(); }
  lastTouchEnd = now;
}, {passive:false});

// ピンチズーム（2本指操作）による拡大を防止
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
document.addEventListener('gestureend', function(e){ e.preventDefault(); }, {passive:false});
// 2本指以上でのtouchmove（ピンチ操作）も防止
document.addEventListener('touchmove', function(e){
  if(e.touches && e.touches.length > 1){ e.preventDefault(); }
}, {passive:false});

// 万が一拡大されてしまった場合の保険：viewportを再適用して強制的に元の倍率に戻す
// ※ 属性の書き換えだけでは最近のiOS Safariで効かないことがあるため、
//   タグ自体を一度削除して作り直す、より強い方式も併用する
const VIEWPORT_CONTENT = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
function forceResetZoom(){
  const old = document.querySelector('meta[name="viewport"]');
  if(old) old.remove();
  const fresh = document.createElement('meta');
  fresh.setAttribute('name', 'viewport');
  fresh.setAttribute('content', VIEWPORT_CONTENT);
  document.head.appendChild(fresh);
}
document.addEventListener('touchend', forceResetZoom, {passive:true});
document.addEventListener('gestureend', forceResetZoom, {passive:true});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') forceResetZoom(); });
window.addEventListener('orientationchange', forceResetZoom);
setInterval(forceResetZoom, 1500); // 定期的にも強制リセット

// ショップの購入/競り上げボタンは頻繁に再描画される領域にあるため、
// clickではなくpointerdownで即座に処理し、再描画によるタップ消失を防ぐ
document.addEventListener('pointerdown', function(e){
  const btn = e.target.closest('[data-action]');
  if(!btn || btn.disabled) return;
  e.preventDefault();
  ensureAudio();
  const action = btn.dataset.action;
  const slot = parseInt(btn.dataset.slot, 10);
  if(action==='buy'){ uiBuy(slot); }
  else if(action==='raise'){ uiRaiseTo(slot, parseInt(btn.dataset.tier,10)); }
  else if(action==='feverbuy'){ feverBuy(state.players[0], slot); }
  else if(action==='reset'){ playOuSound(); uiReset(); }
  else if(action==='settings'){ uiOpenSettings(); }
  else if(action==='selectdiff'){ uiSelectDifficulty(btn.dataset.diff); }
  else if(action==='canceldiff'){ sfxClick(); uiCloseDifficultyModal(); }
  else if(action==='startdiff'){ uiConfirmDifficultyStart(); }
  else if(action==='howto'){ uiOpenHowTo(); }
}, {passive:false});

function playOuSound(){ playSample(SND_OU); }
function playSample(audio, volumeMult){
  if(!soundSettings.on) return;
  try{
    audio.volume = Math.max(0, Math.min(1, soundSettings.volume * (volumeMult!==undefined?volumeMult:1)));
    audio.currentTime = 0;
    audio.play().catch(()=>{});
  }catch(e){}
}
function playClickSound(){ playSample(SND_CLICK); }
function playBidSound(){ playSample(SND_BID); }
function startSpinSound(){
  if(!soundSettings.on) return;
  try{ SND_SPIN.volume = Math.max(0, Math.min(1, soundSettings.volume)); SND_SPIN.currentTime = 0; SND_SPIN.play().catch(()=>{}); }catch(e){}
}
function stopSpinSound(){
  try{ SND_SPIN.pause(); SND_SPIN.currentTime = 0; }catch(e){}
}
// ゲーム終了・リスタート時に、鳴りっぱなしになりうる効果音を全てリセットする（BGMは除く）
function resetAllSfx(){
  [SND_CLICK, SND_BID, SND_SPIN, SND_BUY, SND_PETA, SND_OU].forEach(a=>{
    try{ a.pause(); a.currentTime = 0; }catch(e){}
  });
}

let audioCtx = null;
let audioUnlocked = false;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  }
  if(audioCtx.state==='suspended'){ audioCtx.resume(); }
  if(!audioUnlocked){
    // iOS Safari向け：無音バッファを鳴らして確実にオーディオをアンロックする
    try{
      const buf = audioCtx.createBuffer(1,1,22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf; src.connect(audioCtx.destination); src.start(0);
      audioUnlocked = true;
    }catch(e){}
  }
  if(bgmSettings.on) startBgm();
}
const soundSettings = { on:true, volume:1.0 };

// ---------- BGM（bgmフォルダに複数の曲を置くとランダムで流れる）----------
// 曲を追加したいときは、bgmフォルダに音声ファイルを置いた上で、下の配列に
// {file:'bgm/ファイル名.mp3', name:'表示したい曲名'} を追記してください。
// フォルダの自動取得に失敗した場合のフォールバック用（普段はここを編集しなくてOK）
let BGM_TRACKS = [
  { file: 'bgm/track1.mp3', name: 'Track 1' },
  { file: 'bgm/track2.mp3', name: 'Track 2' },
  { file: 'bgm/track3.mp3', name: 'Track 3' },
];
// 表示上のパーセントと実際の音量を分離する（表示100%＝実際30%、つまり表示50%＝実際15%）
const BGM_VOLUME_SCALE = 0.3;
const bgmSettings = { on:true, displayVolume:30 };
function actualBgmVolume(){ return (bgmSettings.displayVolume/100) * BGM_VOLUME_SCALE; }

// ---------- bgmフォルダの中身をGitHub APIから自動取得 ----------
// GitHub Pagesで公開している場合、bgmフォルダに音声ファイルを置くだけで
// ファイル名から自動的に曲名を作って再生リストに追加する（コード編集不要）
function prettifyTrackName(filename){
  return filename.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ');
}
function detectGithubRepo(){
  const host = location.hostname;
  if(!host.endsWith('.github.io')) return null;
  const owner = host.split('.')[0];
  const parts = location.pathname.split('/').filter(Boolean);
  const repo = parts.length>0 ? parts[0] : host; // プロジェクトページかユーザーページかで変わる
  return {owner, repo};
}
async function loadBgmFolderList(){
  const info = detectGithubRepo();
  if(!info) return; // GitHub Pages以外（ローカル確認時など）は手動リストのまま
  try{
    const res = await fetch(`https://api.github.com/repos/${info.owner}/${info.repo}/contents/bgm`);
    if(!res.ok) return; // bgmフォルダが無い・取得できない場合は手動リストのまま
    const files = await res.json();
    if(!Array.isArray(files)) return;
    const audioExt = /\.(mp3|m4a|wav|ogg)$/i;
    const tracks = files
      .filter(f=>f.type==='file' && audioExt.test(f.name))
      .map(f=>({file:'bgm/'+f.name, name:prettifyTrackName(f.name)}));
    if(tracks.length>0){
      BGM_TRACKS = tracks;
      // すでに再生が始まっていた場合は、取得できたリストで鳴らし直す
      if(bgmStarted) playRandomBgmTrack();
    }
  }catch(e){ /* 取得できなければ手動リストのまま */ }
}
loadBgmFolderList();

// ---------- ゲーム速度（回転時間・AI行動間隔・オークション時間などに反映）----------
const speedSettings = { multiplier: 1 };
function spd(ms){ return ms / speedSettings.multiplier; }

const BGM = new Audio();
let bgmStarted = false;
let bgmGainNode = null;
let currentBgmIndex = -1;
// iOSはHTMLAudioElementの.volumeを無視する仕様のため、Web Audio APIのGainNodeで音量制御する
function ensureBgmGain(){
  if(bgmGainNode || !audioCtx) return;
  try{
    const src = audioCtx.createMediaElementSource(BGM);
    bgmGainNode = audioCtx.createGain();
    bgmGainNode.gain.value = actualBgmVolume();
    src.connect(bgmGainNode);
    bgmGainNode.connect(audioCtx.destination);
  }catch(e){}
}
function escapeHtml(s){

}
function updateBgmTrackDisplay(name){

function playRandomBgmTrack(){
  if(BGM_TRACKS.length===0) return;
  let idx = Math.floor(Math.random()*BGM_TRACKS.length);
  if(BGM_TRACKS.length>1 && idx===currentBgmIndex){ idx = (idx+1) % BGM_TRACKS.length; }
  currentBgmIndex = idx;
  const track = BGM_TRACKS[idx];
  BGM.src = track.file;
  updateBgmTrackDisplay(track.name);
  if(bgmSettings.on) BGM.play().catch(()=>{}); // 該当ファイルが無い場合は静かに失敗する
}

function beep(freq, dur, type, vol, delay){
  if(!audioCtx || !soundSettings.on) return;
  const v = (vol||0.15) * soundSettings.volume;
  if(v<=0) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type||'square';
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(v, t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function noiseClank(dur, freq, q, vol, delay){
  if(!audioCtx || !soundSettings.on) return;
  const v = (vol||0.12) * soundSettings.volume;
  if(v<=0) return;
  const t0 = audioCtx.currentTime + (delay||0);
  const size = Math.max(1, Math.floor(audioCtx.sampleRate*dur));
  const buffer = audioCtx.createBuffer(1, size, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<size;i++) data[i] = (Math.random()*2-1) * (1-i/size);
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = q||10;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(v, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(bp); bp.connect(gain); gain.connect(audioCtx.destination);
  src.start(t0);
}

function diceUpgradeCost(currentCount){
  const cap = 8;
  if(currentCount <= cap) return 8 * Math.pow(4, currentCount-1); // 1個目:8 / 2個目:32 / ... / 8個目:131072
  const base = 8 * Math.pow(4, cap-1); // 131072
  return base + (currentCount - cap) * 60000; // それ以降は線形増加（買えなくなるのを防ぐ）
}

function unlockedRarities(progress){
  if(progress < 250) return ['common'];
  if(progress < 1000) return ['common','rare'];
  if(progress < 2500) return ['common','rare','epic'];
  return ['common','rare','epic','legend'];
}
function weightedItemPick(progress){
  const allowed = unlockedRarities(progress);
  const w = {common:5, rare:3, epic:2, legend:1};
  const pool = [];
  for(const it of ITEMS){
    if(!allowed.includes(it.rarity)) continue;
    let weight = w[it.rarity];
    if(it.type==='flatBonus') weight *= 3; // 出目+系はクリアの生命線なので出現率アップ
    for(let i=0;i<weight;i++) pool.push(it);
  }
  return pool[Math.floor(Math.random()*pool.length)];
}

  try{
    const payload = {
      players: state.players,
      lastGlobalMaxRoll: state.lastGlobalMaxRoll,
      difficulty: state.difficulty,
      ts: Date.now(),
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
  }catch(e){ /* ストレージが使えない環境では何もしない */ }

  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!data || !Array.isArray(data.players)) return null;
    return data;
  }catch(e){ return null; }
}

  addLog('ゲーム開始。9999に最初に到達したプレイヤーの勝ち。');
  updateSelfLive();
}

function getLeader(){
  let best = state.players[0];
  for(const p of state.players) if(p.progress > best.progress) best = p;
  return best;
}
function isImmune(p, key){ return p.effects[key] && p.effects[key] > Date.now(); }

function diceRange(p){
  const min = 1 + p.minBonus;
  let max = 6 + p.maxBonus;
  if(p.effects.maxDownUntil && p.effects.maxDownUntil > Date.now()) max = Math.max(min, max - (p.effects.maxDownAmount||2));
  return {min, max};
}

function checkpointBuffActive(p){
  if(!state.checkpointBuff) return false;
  if(state.checkpointBuff.expiresAt <= Date.now()) return false;
  if(state.checkpointBuff.ownerId === p.id) return false; // 旗を取った本人には効果なし
  return true;
}

function chainLuckActive(p){
  if(!state.chain.type || state.chain.type!=='luck') return false;
  if(state.chain.expiresAt <= Date.now()) return false;
  if(state.chain.excludeLeader && getLeader().id===p.id && countAtMax()<=1) return false;
  return true;
}
function countAtMax(){
  const m = Math.max(...state.players.map(p=>p.progress));
  return state.players.filter(p=>p.progress===m).length;
}
function getRank(p){
  // 進捗が高い順の順位。同点は同順位（1,2,2,4のように扱う）
  const sorted = [...state.players].sort((a,b)=>b.progress-a.progress);
  return sorted.findIndex(x=>x.id===p.id) + 1;
}
// スリップストリームの威力：下位（4位）ほど強く、1位が9999に近いほど全体的に強化される
function slipstreamPower(p){
  const rank = getRank(p);
  const rankFactor = {1:0, 2:1.0, 3:1.6, 4:2.3}[rank] || 1.0;
  const leader = getLeader();
  const proximity = 1 + Math.min(1, leader.progress/GOAL) * 2.5; // 終盤ほど強力（最大3.5倍）
  return rankFactor * proximity;
}

function rollOne(p){
  const {min,max} = diceRange(p);
  let base = min + Math.floor(Math.random()*(max-min+1));
  if(chainLuckActive(p)){
    const power = slipstreamPower(p);
    const chance = Math.min(0.92, 0.3 * power);
    if(Math.random() < chance){
      const bonus = Math.max(1, Math.round(power));
      base = Math.min(max, base + bonus);
    }
  }
  return {val:base, max};
}

function requestRoll(p){
  if(state.winner || state.paused) return;
  if(p.isHuman && state.awaitingFirstRoll){
    state.awaitingFirstRoll = false; // 自分が振った瞬間に、CPUやタイマー類が動き出す
    // 待機中に実時間が経過していても、各種タイマーは今から数え直す
    const n = Date.now();
    state.shop.nextRestock = n + spd(SHOP_RESTOCK_MS);
    state.shop.nextQuickRestock = n + spd(QUICK_RESTOCK_MS);
    state.nextInterestAt = n + 10000;
    state.nextFeverAt = n + (60000 + Math.random()*240000);
  }
  const now = Date.now();
  if(p.rollAnim.active) return;
  if(now < p.busyUntil) return;
  if(isImmune(p,'rollDisabledUntil') && p.effects.rollDisabledUntil>now){
    addLog(`${p.name} はゲージ凍結中で振れない。`);
    return;
  }
  const rawDur = spd(ROLL_ANIM_MS + Math.random()*400);
  const dur = Math.max(180, rawDur - (p.spinReduction||0));
  p.rollAnim = {active:true, startedAt: now, endsAt: now+dur, dur, disp: 1+Math.floor(Math.random()*9)};
  p.busyUntil = now + dur;
  if(p.isHuman){ updateSelfLive(); startSpinSound(); }
}

function compensate(t){
  if(t.insuranceBonus){ t.progress = Math.min(GOAL, t.progress + t.insuranceBonus); }
}

function finalizeRoll(p){
  const dc = p.diceCount;
  let rawTotal = 0;
  let rolls = [];
  for(let i=0;i<dc;i++){
    let r = rollOne(p);
    rolls.push(r.val);
    rawTotal += r.val;
  }
  for(const faces of (p.customDice||[])){
    const v = faces[Math.floor(Math.random()*faces.length)];
    rolls.push(v);
    rawTotal += v;
  }
  const collectorBonus = (p.collectorLevel||0) * Math.floor((p.totalItemsOwned||0)/2);
  rawTotal += collectorBonus;
  rawTotal += (p.flatRollBonus||0);
  const comboMult = 1 + Math.min(p.comboCount||0, 80) * 0.05; // 振り続けるほど一時的に伸びる（最大+4.0倍＝合計5.0倍）。オークション参加でリセット
  const checkpointMult = checkpointBuffActive(p) ? 1.35 : 1; // 誰かが旗を取ると、その人以外に10秒間+35%
  const total = Math.round(rawTotal * (p.multiplierFactor||1) * comboMult * checkpointMult);
  p.lastRollTotal = total;

  const prevMilestone = Math.floor(p.progress/1000);
  p.progress = Math.min(GOAL, p.progress + total + (p.coinBonusPerRoll||0));
  if(Math.floor(p.progress/1000) > prevMilestone){ if(p.isHuman) sfxMilestone(); addLog(`${p.name} が ${Math.floor(p.progress/1000)*1000} を突破！`); }
  // チェックポイント（1000刻み）に最初に到達した人だけ旗を獲得し、他の全員に10秒間+20%バフ
  for(let cp=1000; cp<GOAL; cp+=1000){
    if(p.progress >= cp && !state.checkpointsClaimed[cp]){
      state.checkpointsClaimed[cp] = p.id;
      p.flags = (p.flags||0) + 1;
      state.checkpointBuff = { expiresAt: Date.now()+10000, ownerId: p.id };
      addLog(`${p.name} が ${cp} チェックポイントに最初に到達！旗を獲得！（他の全員に10秒間×1.35バフ）`, 'win');
      if(p.isHuman) sfxCheckpoint();
    }
  }
  if(total > state.lastGlobalMaxRoll){
    state.lastGlobalMaxRoll = total;
    triggerChain('luck', p);
  }
  p.comboCount = (p.comboCount||0) + 1; // ロールし続ける限り伸びる（ショップに参加すると0にリセット）
  if(p.comboCount>=5 && p.comboCount % 5 === 0){
    if(p.isHuman) sfxCombo(p.comboCount);
    addLog(`${p.name} が COMBO x${p.comboCount}！（出目×${comboMult.toFixed(2)}）`, 'win');
    if(p.comboCount % 10 === 0){
      const bonus = p.comboCount * 3;
      p.progress = Math.min(GOAL, p.progress + bonus);
      addLog(`COMBO x${p.comboCount} ボーナス！${p.name}に+${bonus}`, 'win');
    }
  }
  const bonusTxt = ((p.multiplierFactor||1)>1||comboMult>1) ? `（${rawTotal}→×${((p.multiplierFactor||1)*comboMult).toFixed(2)}）` : '';
  addLog(`${p.name} が [${rolls.join(',')}] で合計+${total}${bonusTxt}（進捗${p.progress}）`);
  if(p.isHuman) sfxRollResult(total);
  if(p.isHuman) popRoll(total, p.comboCount);
  triggerAuras(p);
  const newLeader = getLeader();
  if(newLeader.id !== lastLeaderId){ if(lastLeaderId!==null && p.isHuman) sfxLeaderChange(); lastLeaderId = newLeader.id; }
  if(p.progress >= GOAL){
    state.winner = p;
    stopSpinSound();
    clearSavedGame();
    addLog(`${p.name} が 9999 に到達！勝利！`, 'win');
    if(p.isHuman) sfxWin();
    renderWin();
  }
}
let lastLeaderId = null;
function popRoll(total, combo){
  const wrap = document.querySelector('#selfPanel .die-wrap');
  if(!wrap) return;
  const span = document.createElement('span');
  span.className = 'roll-pop';
  span.textContent = (combo>=2) ? `+${total} COMBO x${combo}` : '+'+total;
  if(combo>=2) span.classList.add('combo');
  wrap.appendChild(span);
  setTimeout(()=>{ span.remove(); }, 780);
}

function triggerAuras(p){
  if(!p.auraProc) return;
  const others = state.players.filter(x=>x.id!==p.id);
  if(others.length===0) return;
  const now = Date.now();
  let fired = false;
  // トラップは基本的に現在の1位を狙う（自分が1位の場合はランダムに他を狙う）
  const pick = ()=> {
    const leader = getLeader();
    if(leader.id !== p.id){
      const target = others.find(x=>x.id===leader.id);
      if(target) return target;
    }
    return others[Math.floor(Math.random()*others.length)];
  };
  // CPUのトラップは難易度に応じて発動確率が変化する（人間自身のトラップには影響しない）
  const trapMult = p.isHuman ? 1 : ((DIFFICULTY_MULT[state.difficulty]||DIFFICULTY_MULT.normal).trapProc);
  if(p.auraProc.maxDown && Math.random()<p.auraProc.maxDown*trapMult){
    const t = pick();
    t.effects.maxDownUntil = now + 8000*(1-(t.debuffResist||0));
    t.effects.maxDownAmount = 2; t.lastAttackerBy = p.name; compensate(t);
    addLog(`${p.name}の目潰しトラップが${t.name}を襲った！`, 'atk'); fired = true;
  }
  if(p.auraProc.freeze && Math.random()<p.auraProc.freeze*trapMult){
    const t = pick();
    t.effects.rollDisabledUntil = now + 2000*(1-(t.debuffResist||0));
    t.lastAttackerBy = p.name; compensate(t);
    addLog(`${p.name}のゲージ凍結トラップが${t.name}を止めた！`, 'atk'); fired = true;
  }
  if(p.auraProc.priceUp && Math.random()<p.auraProc.priceUp*trapMult){
    const t = pick();
    t.effects.priceUpUntil = now + 10000*(1-(t.debuffResist||0));
    t.lastAttackerBy = p.name; compensate(t);
    addLog(`${p.name}の割高トラップが${t.name}を直撃！`, 'atk'); fired = true;
  }
  if(p.auraProc.shelfLock && Math.random()<p.auraProc.shelfLock*trapMult){
    const candidates = [0,1,2].filter(i=>!state.shop.auctions[i]);
    if(candidates.length>0){
      const idx = candidates[Math.floor(Math.random()*candidates.length)];
      state.shop.lockedUntil[idx] = now + 8000;
      addLog(`${p.name}の棚荒らしトラップが発動！`, 'atk'); fired = true;
    }
  }
  if(p.auraProc.coinSteal && Math.random()<p.auraProc.coinSteal*trapMult){
    const t = pick();
    if(t.effects.immuneStealPermanent){ /* 被弾側の防御は自分のアクションではないため無音 */ }
    else {
      const amount = Math.max(1, Math.round(t.progress * 0.18 * (1-(t.debuffResist||0))));
      t.progress = Math.max(0, t.progress - amount);
      p.progress = Math.min(GOAL, p.progress + amount);
      t.lastAttackerBy = p.name;
      addLog(`${p.name}のコイン強奪トラップが${t.name}から${amount}コイン奪った！`, 'atk'); fired = true;
    }
  }
  if(p.auraProc.fakeBubble && Math.random()<p.auraProc.fakeBubble*trapMult){
    const t = pick();
    if(t.effects.immuneFakePermanent){ /* 被弾側の防御は自分のアクションではないため無音 */ }
    else {
      t.bubble = '？？？'; t.bubbleUntil = now+4000; t.lastAttackerBy = p.name; compensate(t); fired = true;
    }
  }
  if(fired && p.isHuman) sfxAura();
}

// fast visual-only loop: mutates existing DOM nodes directly, never rebuilds them
setInterval(()=>{
  if(!state.running || state.winner || state.paused || state.awaitingFirstRoll) return;
  const now = Date.now();
  for(const p of state.players){
    if(p.rollAnim.active){
      if(now >= p.rollAnim.endsAt){
        p.rollAnim.active = false;
        if(p.isHuman) stopSpinSound();
        finalizeRoll(p);
      } else {
        p.rollAnim.disp = 1+Math.floor(Math.random()*9);
      }
    }
  }
  updateSelfLive();
  updateOppLive();
}, 60);

function triggerChain(type, player){
  const bonusSec = player ? (player.chainBonusSec||0) : 0;
  const base = type==='luck' ? CHAIN_LUCK_MS : CHAIN_MS_DEFAULT;
  const dur = base + bonusSec*1000;
  state.chain = {type, expiresAt: Date.now()+dur, excludeLeader:true};
  renderScroll();
}

// ---------- shop ----------
const QUICK_RESTOCK_MS = 5000;

function rollPreviewBatch(){
  const gameProgress = Math.max(...state.players.map(p=>p.progress), 0);
  const preview = [];
  for(let i=0;i<3;i++){
    let item;
    if(Math.random()<0.18){
      const pool = ITEMS.filter(it=>it.rarity==='epic'||it.rarity==='legend');
      item = pool[Math.floor(Math.random()*pool.length)];
    } else {
      item = weightedItemPick(gameProgress);
    }
    preview.push(item);
  }
  return preview;
}

function restockBatch(onlyEmpty){
  const now = Date.now();
  const gameProgress = Math.max(...state.players.map(p=>p.progress), 0);
  let count = 0;
  let jackpot = false;
  const preview = (!onlyEmpty) ? (state.shop.preview || rollPreviewBatch()) : null;
  for(let i=0;i<3;i++){
    if(state.shop.lockedUntil[i] > now) continue;
    if(state.shop.auctions[i]) continue; // 入札中の枠は補充で潰さない
    if(onlyEmpty && state.shop.slots[i] !== null) continue;
    let item;
    if(!onlyEmpty){
      item = preview[i];
      if(item.rarity==='epic'||item.rarity==='legend') jackpot = true;
    } else {
      item = weightedItemPick(gameProgress);
    }
    state.shop.slots[i] = {...item};
    count++;
  }
  if(!onlyEmpty){ state.shop.preview = rollPreviewBatch(); }
  if(count>0){
    if(jackpot){ addLog(`棚に高額アイテムが混ざって入荷した！`, 'win'); }
    else { addLog(onlyEmpty ? `棚に${count}個、追加で入荷しました。` : `棚が一斉に補充されました（${count}個）。`); }
  }
}

function bulkDiceCost(currentCount, n, premium){
  let sum = 0;
  for(let i=0;i<n;i++){ sum += diceUpgradeCost(currentCount+i); }
  return Math.min(999999, Math.round(sum * premium));
}

function priceFor(p, item){
  let price;
  if(item.type==='addDice') price = diceUpgradeCost(p.diceCount);
  else if(item.type==='addDice2') price = bulkDiceCost(p.diceCount, 2, 0.95); // まとめ買いは個別より少し安い
  else if(item.type==='addDice3') price = bulkDiceCost(p.diceCount, 3, 0.85);
  else if(item.type==='addDice5') price = bulkDiceCost(p.diceCount, 5, 0.7);
  else price = item.price;
  if(item.type!=='addDice' && item.type!=='addDice2' && item.type!=='addDice3' && item.type!=='addDice5'){
    const cnt = p.purchaseCount[item.type] || 0;
    const rate = item.type==='flatBonus' ? 1.35 : 1.55; // 出目+系は重ね買いしても値上がりを緩やかに
    price = Math.round(price * Math.pow(rate, cnt));
  }
  if(p.effects.priceUpUntil && p.effects.priceUpUntil>Date.now()){
    price = Math.round(price * (1 + 0.3*(1-(p.econResist||0))));
  }
  if(p.priceDiscount){ price = Math.round(price * (1-p.priceDiscount)); }
  if(state.chain.type==='discount' && state.chain.expiresAt>Date.now()){
    const leader = getLeader();
    if(!(state.chain.excludeLeader && leader.id===p.id && countAtMax()<=1)) price = Math.round(price*0.85);
  }
  return Math.max(0, price);
}

function startAuction(p, slotIdx){
  if(state.winner || state.paused) return;
  const item = state.shop.slots[slotIdx];
  if(!item || state.shop.lockedUntil[slotIdx] > Date.now() || state.shop.auctions[slotIdx]) return;
  const basePrice = priceFor(p, item);
  const price = Math.round(basePrice * MULT_SEQ[0]);
  if(p.progress < price) { addLog(`${p.name} は進捗が足りず入札できなかった。`); if(p.isHuman) sfxFail(); return; }
  state.shop.auctions[slotIdx] = { bidder: p.id, tier: 0, basePrice, deadline: Date.now()+spd(AUCTION_MS) };
  if(p.comboCount>0){ addLog(`${p.name} のCOMBOが途切れた（ショップに参加）`); }
  p.comboCount = 0; // オークションに参加するとコンボの勢いが途切れる
  addLog(`${p.name} が「${item.name}」に${price}コインで入札！誰か競る？（${AUCTION_MS/1000}秒）`);
  if(p.isHuman) sfxBidStart();
  renderScroll();
}

function raiseAuction(p, slotIdx, targetTier){
  if(state.winner || state.paused) return;
  const auc = state.shop.auctions[slotIdx];
  const item = state.shop.slots[slotIdx];
  if(!auc || !item || auc.bidder === p.id) return;
  const tier = (targetTier!==undefined) ? targetTier : auc.tier + 1;
  if(tier <= auc.tier || tier >= MULT_SEQ.length) return;
  const price = Math.round(auc.basePrice * MULT_SEQ[tier]);
  if(p.progress < price) { if(p.isHuman){ addLog(`${p.name} は進捗が足りず競り負けた。`); sfxFail(); } return; }
  auc.bidder = p.id;
  auc.tier = tier;
  auc.deadline = Date.now()+spd(AUCTION_MS);
  p.comboCount = 0; // 競り上げに参加するとコンボの勢いが途切れる
  addLog(`${p.name} が${MULT_SEQ[tier]}倍（${price}コイン）で競り上げた！`);
  if(p.isHuman) sfxBidRaise(tier);
  renderScroll();
}

// 落札・購入を確定させる共通処理（通常オークション・フィーバー購入の両方から使う）
function finalizePurchase(slotIdx, bidder, item, price, logSuffix){
  state.shop.slots[slotIdx] = null;
  bidder.purchaseCount[item.type] = (bidder.purchaseCount[item.type]||0) + 1;
  bidder.totalItemsOwned = (bidder.totalItemsOwned||0) + 1;
  bidder.inventory.push({name:item.name, rarity:item.rarity, desc:item.desc});
  if(bidder.inventory.length>50) bidder.inventory.shift();
  if(item.type==='junk'){
    addLog(`${bidder.name} が「${item.name}」を${price}コインで${logSuffix}…完全な無駄だった`, 'atk');
    if(bidder.isHuman) sfxFail();
  } else {
    applyEffect(bidder, item);
    addLog(`${bidder.name} が「${item.name}」を${price}コインで${logSuffix}！`, 'win');
    if(bidder.isHuman) sfxAuctionWin();
  }
  triggerChain('discount', bidder);
  renderScroll();
}

function resolveAuctionSlot(slotIdx){
  const auc = state.shop.auctions[slotIdx];
  if(!auc) return;
  const item = state.shop.slots[slotIdx];
  state.shop.auctions[slotIdx] = null;
  if(!item) return;
  const bidder = state.players.find(x=>x.id===auc.bidder);
  if(!bidder){ state.shop.slots[slotIdx] = null; return; }
  const price = Math.round(auc.basePrice * MULT_SEQ[auc.tier]);
  if(bidder.progress < price){
    addLog(`${bidder.name} は支払えず「${item.name}」の落札が流れた…`, 'atk');
    state.shop.slots[slotIdx] = null;
    if(bidder.isHuman) sfxFail();
    renderScroll();
    return;
  }
  bidder.progress -= price;
  finalizePurchase(slotIdx, bidder, item, price, '落札');
}

// フィーバータイム中：最大入札額（10倍）の2倍を払えば即座に確定購入できる
const FEVER_MULT = MULT_SEQ[MULT_SEQ.length-1]; // 最大入札額（10倍）そのもの
function feverBuyPrice(p, slotIdx){
  const item = state.shop.slots[slotIdx];
  if(!item) return null;
  const auc = state.shop.auctions[slotIdx];
  const basePrice = auc ? auc.basePrice : priceFor(p, item);
  return Math.round(basePrice * FEVER_MULT);
}
function feverBuy(p, slotIdx){
  if(!state.feverTime || state.winner || state.paused) return;
  const item = state.shop.slots[slotIdx];
  if(!item) return;
  const price = feverBuyPrice(p, slotIdx);
  if(p.progress < price){ if(p.isHuman){ addLog(`${p.name} は進捗が足りずフィーバー購入できなかった。`); sfxFail(); } return; }
  p.progress -= price;
  state.shop.auctions[slotIdx] = null; // 進行中の入札があれば打ち切り
  p.comboCount = 0; // ショップ参加なのでコンボは途切れる
  finalizePurchase(slotIdx, p, item, price, 'フィーバー購入');
  if(p.isHuman) sfxCheckpoint(); // 派手な専用音を流用
}

function checkComboSetA(p){
  if(p.comboPieces.a1 && p.comboPieces.a2 && p.comboPieces.a3 && !p.effects.comboSetAComplete){
    p.effects.comboSetAComplete = true;
    p.multiplierFactor = (p.multiplierFactor||1) * 10; // 実質10倍
    addLog(`${p.name} が三色の欠片を揃えた！合計出目が実質10倍に！`, 'win');
    if(p.isHuman) sfxJackpot();
  }
}

function applyEffect(p, item){
  const now = Date.now();
  switch(item.type){
    case 'addDice': p.diceCount += 1; break;
    case 'maxUp': p.maxBonus += 2; break;
    case 'maxUp2': p.maxBonus += 4; break;
    case 'maxUp4': p.maxBonus += 8; break;
    case 'shiftRange': p.minBonus += 1; p.maxBonus += 1; break;
    case 'shiftRange2': p.minBonus += 2; p.maxBonus += 2; break;
    case 'coinBoost': p.coinBonusPerRoll = (p.coinBonusPerRoll||0) + 1; break;
    case 'priceDiscount': p.priceDiscount = Math.min(0.5, (p.priceDiscount||0) + 0.05); break;
    case 'spinReduce': p.spinReduction = Math.min(1500, (p.spinReduction||0) + 350); break;
    case 'spinReduce2': p.spinReduction = Math.min(1500, (p.spinReduction||0) + 650); break;
    case 'debuffResist': p.debuffResist = Math.min(0.75, (p.debuffResist||0) + 0.15); break;
    case 'econResist': p.econResist = Math.min(0.8, (p.econResist||0) + 0.2); break;
    case 'immuneStealPerm': p.effects.immuneStealPermanent = true; break;
    case 'immuneFakePerm': p.effects.immuneFakePermanent = true; break;
    case 'seeCoinsPerm': p.effects.seeCoinsPermanent = true; break;
    case 'seeRestockPerm': p.effects.seeRestockPermanent = true; break;
    case 'revealAttackerPerm': p.effects.revealAttackerPermanent = true; break;
    case 'previewPerm': p.effects.previewPermanent = true; break;
    case 'chainBonus': p.chainBonusSec = Math.min(8, (p.chainBonusSec||0) + 1); break;
    case 'auraMaxDown': p.auraProc.maxDown = Math.min(0.5, (p.auraProc.maxDown||0) + 0.08); break;
    case 'auraFreeze': p.auraProc.freeze = Math.min(0.42, (p.auraProc.freeze||0) + 0.07); break;
    case 'auraPriceUp': p.auraProc.priceUp = Math.min(0.5, (p.auraProc.priceUp||0) + 0.08); break;
    case 'auraShelfLock': p.auraProc.shelfLock = Math.min(0.42, (p.auraProc.shelfLock||0) + 0.07); break;
    case 'auraCoinSteal': p.auraProc.coinSteal = Math.min(0.5, (p.auraProc.coinSteal||0) + 0.08); break;
    case 'auraFakeBubble': p.auraProc.fakeBubble = Math.min(0.65, (p.auraProc.fakeBubble||0) + 0.1); break;
    case 'interest': p.interestRate = Math.min(0.03, (p.interestRate||0) + 0.005); break;
    case 'insurance': p.insuranceBonus = (p.insuranceBonus||0) + 5; break;
    case 'scoutPerm': p.effects.scoutPermanent = true; break;
    case 'multiplier': p.multiplierFactor = (p.multiplierFactor||1) * (1 + (item.amount||0.1)); break; // 複利で重なる（上限なし）
    case 'multiplierBig': p.multiplierFactor = (p.multiplierFactor||1) * 10; break; // 一撃で実質10倍
    case 'flatBonus': p.flatRollBonus = (p.flatRollBonus||0) + (item.amount||0); break;
    case 'multiplierJump': p.multiplierFactor = (p.multiplierFactor||1) * (1 + (item.amount||0)); break;
    case 'comboPieceA1': p.comboPieces.a1 = true; checkComboSetA(p); break;
    case 'comboPieceA2': p.comboPieces.a2 = true; checkComboSetA(p); break;
    case 'comboPieceA3': p.comboPieces.a3 = true; checkComboSetA(p); break;
    case 'customDieShady': p.customDice.push([-5,-5,-5,-5,15,15]); break;
    case 'customDieGamble': p.customDice.push([-10,-10,-10,50,50,50]); break;
    case 'customDieGolden': p.customDice.push([30,30,40,40,80,80]); break;
    case 'addDice2': p.diceCount += 2; break;
    case 'addDice3': p.diceCount += 3; break;
    case 'addDice5': p.diceCount += 5; break;
    case 'collectorBonus': p.collectorLevel = Math.min(20, (p.collectorLevel||0) + 1); break;
  }
}

// ---------- game tick (shop timers / AI decisions) ----------
setInterval(()=>{
  if(!state.running || state.winner || state.paused || state.awaitingFirstRoll) return;
  const now = Date.now();
  if(now >= (state.nextAutoSaveAt||0)){
    saveGame();
    state.nextAutoSaveAt = now + 4000;
  }
  if(!state.shop.warned && state.shop.nextRestock - now <= 5000 && state.shop.nextRestock - now > 4700){
    addLog('まもなく棚が一斉に補充されるぞ！');
    state.shop.warned = true;
  }
  if(now >= state.shop.nextRestock){
    restockBatch(false);
    state.shop.nextRestock = now + spd(SHOP_RESTOCK_MS);
    state.shop.warned = false;
  }
  if(now >= (state.shop.nextQuickRestock||0)){
    restockBatch(true);
    state.shop.nextQuickRestock = now + spd(QUICK_RESTOCK_MS);
  }
  if(now >= (state.nextInterestAt||0)){
    for(const p of state.players){
      if(p.interestRate){ p.progress = Math.min(GOAL, p.progress + Math.max(1, Math.round(p.progress * p.interestRate))); }
    }
    state.nextInterestAt = now + 10000;
  }
  // フィーバータイム：一定間隔で30秒だけ発生する「一気に確定購入できる」イベント
  if(!state.feverTime && now >= (state.nextFeverAt||0)){
    state.feverTime = { expiresAt: now + 30000 };
    addLog('FEVER TIME！ 最大入札額（10倍）を払えば即座に確定購入できるぞ！', 'win');
    showFeverBanner();
  } else if(state.feverTime && now >= state.feverTime.expiresAt){
    state.feverTime = null;
    state.nextFeverAt = now + (60000 + Math.random()*240000); // 次回は60〜300秒後
    addLog('フィーバータイムが終了した。');
  }
  for(let i=0;i<3;i++){
    const auc = state.shop.auctions[i];
    if(auc && now >= auc.deadline){ resolveAuctionSlot(i); }
  }
  for(const p of state.players){ if(p.bubbleUntil && now>p.bubbleUntil){ p.bubble=null; p.bubbleUntil=0; } }
  if(state.chain.type && state.chain.expiresAt<=now){ state.chain.type=null; }

  for(const p of state.players){
    if(p.isHuman) continue;
    p.aiTimer -= 200;
    if(p.aiTimer<=0){
      if(p.personality==='aggressive') p.aiTimer = spd(250 + Math.random()*350);
      else if(p.personality==='gambler') p.aiTimer = spd(220 + Math.random()*800); // 不規則
      else p.aiTimer = spd(380 + Math.random()*450); // economist：安定ペース
      aiAct(p);
    }
  }
  renderScroll(); // cheap: never touches the self roll button
}, 200);

// アイテムの系統分類（個性ごとの好みに使う）
function classifyItem(item){
  if(item.type==='junk') return 'junk';
  if(item.type.startsWith('aura')) return 'offense';
  if(['coinBoost','priceDiscount','debuffResist','econResist','immuneStealPerm','immuneFakePerm','interest','insurance'].includes(item.type)) return 'economy';
  if(['addDice','addDice2','addDice3','addDice5','maxUp','maxUp2','maxUp4','shiftRange','shiftRange2','multiplier','multiplierBig','multiplierJump','flatBonus','collectorBonus','customDieShady','customDieGamble','customDieGolden','comboPieceA1','comboPieceA2','comboPieceA3'].includes(item.type)) return 'growth';
  return 'info';
}

// 個性ごとの設定（行動頻度・買い物の好み・ガラクタ許容度・入札の積極性）
const PERSONALITY = {
  aggressive: { actRate:0.16, weights:{offense:3.5, growth:1.5, economy:0.7, info:0.6, junk:0.05}, junkChance:0.05, raiseBoldness:1.05 },
  economist:  { actRate:0.12, weights:{offense:0.5, growth:1.8, economy:3.0, info:1.0, junk:0.03}, junkChance:0.03, raiseBoldness:0.65 },
  gambler:    { actRate:0.14, weights:{offense:1.2, growth:2.2, economy:0.8, info:0.8, junk:1.0}, junkChance:0.28, raiseBoldness:1.2 },
};

// ---------- CPUの強さ（EASY / NORMAL / HARD）----------
const DIFFICULTY_MULT = {
  easy:   { actRate:0.55, raiseBoldness:0.65, trapProc:0.85 },
  normal: { actRate:1.0,  raiseBoldness:1.0,  trapProc:1.0  },
  hard:   { actRate:1.6,  raiseBoldness:1.4,  trapProc:1.3  },
};
const DIFF_UNLOCK_KEY = 'game9999_difficulty_unlocked_v1';
function loadDifficultyUnlocked(){
  try{
    const raw = localStorage.getItem(DIFF_UNLOCK_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { easy:true, normal:false, hard:false };
}
function saveDifficultyUnlocked(u){
  try{ localStorage.setItem(DIFF_UNLOCK_KEY, JSON.stringify(u)); }catch(e){}
}
let selectedDifficulty = 'easy';

function aiAct(p){
  if(state.winner || state.paused) return;
  const conf = PERSONALITY[p.personality] || { actRate:0.16, weights:{offense:1,growth:1,economy:1,info:1,junk:0.1}, junkChance:0.1, raiseBoldness:1.0 };
  const dm = DIFFICULTY_MULT[state.difficulty] || DIFFICULTY_MULT.normal;
  const effActRate = conf.actRate * dm.actRate;
  const effRaiseBoldness = conf.raiseBoldness * dm.raiseBoldness;
  // フィーバータイム中は、余裕があれば低確率でフィーバー購入を狙う
  if(state.feverTime && state.feverTime.expiresAt > Date.now() && Math.random() < 0.12){
    const now = Date.now();
    const options = [];
    for(let i=0;i<3;i++){
      const it = state.shop.slots[i];
      if(!it || state.shop.lockedUntil[i] > now) continue;
      const cost = feverBuyPrice(p, i);
      if(p.progress >= cost && classifyItem(it)!=='junk') options.push(i);
    }
    if(options.length>0){
      feverBuy(p, options[Math.floor(Math.random()*options.length)]);
      return;
    }
  }
  if(Math.random() < effActRate){
    const now = Date.now();
    const candidates = [];
    for(let i=0;i<3;i++){
      const it = state.shop.slots[i];
      if(!it || state.shop.lockedUntil[i] > now) continue;
      const cat = classifyItem(it);
      const auc = state.shop.auctions[i];
      if(!auc){
        const price = Math.round(priceFor(p, it) * MULT_SEQ[0]);
        if(p.progress >= price) candidates.push({idx:i, action:'start', cat, weight:conf.weights[cat]||1});
      } else if(auc.bidder !== p.id){
        const timeSinceLastBid = AUCTION_MS - (auc.deadline - now);
        const reactDelay = 1300 / effRaiseBoldness; // 積極的な性格・難易度ほど反応が早い
        if(timeSinceLastBid < reactDelay) continue;
        const nextTier = auc.tier + 1;
        if(nextTier < MULT_SEQ.length){
          const price = Math.round(auc.basePrice * MULT_SEQ[nextTier]);
          if(p.progress >= price) candidates.push({idx:i, action:'raise', cat, weight:(conf.weights[cat]||1)*effRaiseBoldness});
        }
      }
    }
    if(candidates.length>0){
      const goodOnes = candidates.filter(c=>c.cat!=='junk');
      const pool = (goodOnes.length>0 && Math.random()>conf.junkChance) ? goodOnes : candidates;
      // 好みの系統ほど選ばれやすい重み付き抽選
      const totalW = pool.reduce((s,c)=>s+c.weight, 0);
      let r = Math.random()*totalW;
      let pick = pool[0];
      for(const c of pool){ if(r<c.weight){ pick=c; break; } r-=c.weight; }
      if(pick.action==='start') startAuction(p, pick.idx); else raiseAuction(p, pick.idx);
      return;
    }
  }
  requestRoll(p);
}

  const btn = document.getElementById('rollBtn');

  const cdLabel = document.getElementById('cdLabel');

    let disabled = !!state.winner || frozen || spinning;
    btn.disabled = disabled;

  }
  if(cdFill && cdLabel){
    if(frozen){ cdFill.style.width='0%'; cdFill.className='cooldown-bar-fill frozen'; cdLabel.textContent='ゲージ凍結中'; }
    else if(spinning){
      const frac = Math.min(1, (now-human.rollAnim.startedAt)/human.rollAnim.dur);
      cdFill.style.width = (frac*100)+'%';
      cdFill.className='cooldown-bar-fill spinning';
      cdLabel.textContent = '回転中（＝クールタイム）...' + (human.spinReduction?` ／ 回転短縮 -${human.spinReduction}ms`:'');
    } else {
      cdFill.style.width='100%';
      cdFill.className='cooldown-bar-fill';
      cdLabel.textContent = state.awaitingFirstRoll ? 'サイコロを振ってスタート！' : ('準備完了 — 振れます' + (human.spinReduction?` ／ 回転短縮 -${human.spinReduction}ms`:''));
    }
  }
  const badgesEl = document.getElementById('selfBadges');
  if(badgesEl) badgesEl.innerHTML = renderBadges(human, now);

  // purchased items — simple chip list at top of self window, tap for a speech-bubble tip
  const invEl = document.getElementById('invRow');
  if(invEl){
    if(human.inventory.length===0){
      invEl.innerHTML = '<span class="inv-empty">まだアイテムを持っていません</span>';
    } else {
      invEl.innerHTML = human.inventory.map((it,idx)=>{
        const c = RARITY[it.rarity].color;
        return `<span class="inv-chip" style="border-color:${c};color:${c}" onclick="showInvTip(this, ${idx})">${it.name}</span>`;
      }).join('');
    }
  }
}

function showInvTip(el, idx){
  const human = state.players[0];

  const panel = document.getElementById('invPanel');
  if(!item || !tip || !panel) return;
  tip.textContent = item.desc;

  const elRect = el.getBoundingClientRect();
  tip.style.left = Math.max(4, elRect.left - panelRect.left) + 'px';
  tip.style.top = (elRect.top - panelRect.top - 8) + 'px';
  tip.style.transform = 'translateY(-100%)';
  tip.classList.add('show');
  clearTimeout(invTipTimer);
  invTipTimer = setTimeout(()=> tip.classList.remove('show'), 2600);
}

function renderBadges(p, now){
  let b='';
  // 一時的な状態（受けている妨害など）
  if(p.effects.priceUpUntil>now) b+=`<span class="badge debuff">割高中</span>`;
  if(p.effects.maxDownUntil>now) b+=`<span class="badge debuff">目潰し中</span>`;
  if(p.effects.rollDisabledUntil>now) b+=`<span class="badge debuff">凍結中</span>`;
  if(p.effects.revealAttackerPermanent && p.lastAttackerBy) b+=`<span class="badge">最終攻撃者:${p.lastAttackerBy}</span>`;
  // 永続ステータス
  if(p.diceCount>1) b+=`<span class="badge">ダイス×${p.diceCount}</span>`;
  if(p.maxBonus>0||p.minBonus>0) b+=`<span class="badge">出目+${p.minBonus}/+${p.maxBonus}</span>`;
  if(p.coinBonusPerRoll>0) b+=`<span class="badge">コイン+${p.coinBonusPerRoll}/回</span>`;
  if(p.priceDiscount>0) b+=`<span class="badge">値引-${Math.round(p.priceDiscount*100)}%</span>`;
  if(p.spinReduction>0) b+=`<span class="badge">回転-${p.spinReduction}ms</span>`;
  if(p.debuffResist>0) b+=`<span class="badge buff">妨害耐性${Math.round(p.debuffResist*100)}%</span>`;
  if(p.econResist>0) b+=`<span class="badge buff">経済耐性${Math.round(p.econResist*100)}%</span>`;
  if(p.effects.immuneStealPermanent) b+=`<span class="badge buff">盗難耐性</span>`;
  if(p.effects.immuneFakePermanent) b+=`<span class="badge buff">目視回避</span>`;
  if(p.chainBonusSec>0) b+=`<span class="badge">CHAIN+${p.chainBonusSec}秒</span>`;
  if(p.multiplierFactor>1) b+=`<span class="badge">出目×${p.multiplierFactor.toFixed(2)}</span>`;
  if(p.flatRollBonus>0) b+=`<span class="badge">出目+${p.flatRollBonus}/回</span>`;
  if(p.customDice && p.customDice.length>0) b+=`<span class="badge">特殊ダイス×${p.customDice.length}</span>`;
  if(p.comboPieces && (p.comboPieces.a1||p.comboPieces.a2||p.comboPieces.a3) && !p.effects.comboSetAComplete){
    const got = ['a1','a2','a3'].filter(k=>p.comboPieces[k]).length;
    b+=`<span class="badge">欠片${got}/3</span>`;
  }
  if(p.effects.comboSetAComplete) b+=`<span class="badge combo-badge active">欠片コンプ！×10</span>`;
  if(p.flags>0) b+=`<span class="badge">旗×${p.flags}</span>`;
  if(checkpointBuffActive(p)) b+=`<span class="badge buff">旗バフ×1.35（残り${Math.ceil((state.checkpointBuff.expiresAt-now)/1000)}秒）</span>`;
  if(p.collectorLevel>0) b+=`<span class="badge">収集の力+${(p.collectorLevel||0)*Math.floor((p.totalItemsOwned||0)/3)}（所持${p.totalItemsOwned||0}）</span>`;
  if(p.comboCount>=2){
    b+=`<span class="badge combo-badge active">COMBO x${p.comboCount}（出目×${(1+Math.min(p.comboCount,80)*0.05).toFixed(2)}）</span>`;
  } else {
    b+=`<span class="badge combo-badge">COMBO</span>`;
  }
  if(p.interestRate>0) b+=`<span class="badge">利息${(p.interestRate*100).toFixed(1)}%</span>`;
  if(p.insuranceBonus>0) b+=`<span class="badge buff">保険+${p.insuranceBonus}</span>`;
  if(p.effects.scoutPermanent) b+=`<span class="badge buff">偵察</span>`;
  if(p.auraProc){
    if(p.auraProc.maxDown) b+=`<span class="badge debuff">目潰しトラップ${Math.round(p.auraProc.maxDown*100)}%</span>`;
    if(p.auraProc.freeze) b+=`<span class="badge debuff">凍結トラップ${Math.round(p.auraProc.freeze*100)}%</span>`;
    if(p.auraProc.priceUp) b+=`<span class="badge debuff">割高トラップ${Math.round(p.auraProc.priceUp*100)}%</span>`;
    if(p.auraProc.shelfLock) b+=`<span class="badge debuff">棚荒らし${Math.round(p.auraProc.shelfLock*100)}%</span>`;
    if(p.auraProc.coinSteal) b+=`<span class="badge debuff">強奪${Math.round(p.auraProc.coinSteal*100)}%</span>`;
    if(p.auraProc.fakeBubble) b+=`<span class="badge debuff">フェイク${Math.round(p.auraProc.fakeBubble*100)}%</span>`;
  }
  return b;
}

function renderWin(){
  // 結果画面ではBGMを別の曲に切り替える
  if(bgmSettings.on && bgmStarted) playRandomBgmTrack();
  // 人間が勝利した場合、次の難易度を解放する
  if(state.winner && state.winner.isHuman){
    const unlocked = loadDifficultyUnlocked();
    if(state.difficulty==='easy' && !unlocked.normal){ unlocked.normal = true; saveDifficultyUnlocked(unlocked); }
    else if(state.difficulty==='normal' && !unlocked.hard){ unlocked.hard = true; saveDifficultyUnlocked(unlocked); }
  }
  const OPP_COLORS = ['var(--red)','var(--blue)','var(--yellow)'];
  const sorted = [...state.players].sort((a,b)=>b.progress-a.progress);
  let rows = '';
  sorted.forEach((p, idx)=>{
    const rank = idx+1;
    const color = p.isHuman ? 'var(--blue)' : OPP_COLORS[state.players.filter(x=>!x.isHuman).indexOf(p) % OPP_COLORS.length];
    const items = p.inventory && p.inventory.length ? p.inventory.map(it=>`<span class="result-chip" style="border-color:${RARITY[it.rarity].color};color:${RARITY[it.rarity].color}">${it.name}</span>`).join('') : `<span class="inv-empty">アイテムなし</span>`;
    rows += `<div class="result-card" style="border-color:${color}">
      <div class="result-head">
        <span class="rank-badge" style="position:static;border-color:${color};color:${color}">${rank}位</span>
        <b style="color:${color}">${p.name}</b>
        <span class="mono" style="margin-left:auto;color:${color}">${fmt(p.progress)}</span>
      </div>
      <div class="result-stats mono">ダイス×${p.diceCount} ／ 出目×${(p.multiplierFactor||1).toFixed(2)} ／ ボーナス+${p.flatRollBonus||0} ／ 旗×${p.flags||0}</div>
      <div class="result-items">${items}</div>
    </div>`;
  });
  const unlockMsg = (state.winner.isHuman && state.difficulty==='easy') ? `<div class="unlock-msg">NORMAL UNLOCKED ／ 普通が解放されました</div>`
    : (state.winner.isHuman && state.difficulty==='normal') ? `<div class="unlock-msg">HARD UNLOCKED ／ 強いが解放されました</div>` : '';
  const html = `<div class="win-overlay">
    <div style="color:var(--sub);letter-spacing:3px;font-size:11px;margin-bottom:4px">WINNER</div>
    <h1 style="margin:0 0 12px;">${state.winner.name}</h1>
    ${unlockMsg}
    <div class="result-list">${rows}</div>
    <button data-action="reset">もう一度</button>
  </div>`;
  document.getElementById('app').insertAdjacentHTML('beforeend', html);
}

    const fresh = state.players[idx];
    return Object.assign(fresh, sp, {
      rollAnim:{active:false, endsAt:0, startedAt:0, dur:0, disp:1},
      busyUntil:0, aiTimer:0, bubble:null, bubbleUntil:0,
    });
  });
  state.lastGlobalMaxRoll = saved.lastGlobalMaxRoll||0;
  state.difficulty = saved.difficulty || 'easy';
  lastLeaderId = null; lastSelfRank = null;
  updateSelfLive();
  addLog('セーブデータから再開しました。');
}
